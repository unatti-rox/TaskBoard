<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creative Ops Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">CREATIVE <span>OPS</span></div>

    <nav id="nav" aria-label="Main">
      <div class="nav-title">Workspace</div>
      <button class="nav-item" data-view="today">Today</button>
      <button class="nav-item" data-view="tasks">Tasks</button>
      <button class="nav-item" data-view="projects">Projects</button>
      <button class="nav-item" data-view="brands">Brands</button>

      <div class="nav-title">Team</div>
      <button class="nav-item" data-view="bandwidth">Bandwidth</button>
      <button class="nav-item" data-view="reports">Daily Reports</button>
      <button class="nav-item" data-view="logs">Time Logs</button>

      <div class="nav-title">Tools</div>
      <button class="nav-item" data-view="creative-export">Creative Export</button>

      <div class="nav-title">Management</div>
      <button class="nav-item" data-view="analytics">Analytics</button>
      <button class="nav-item" data-view="notifications">Notifications</button>
      <button class="nav-item" data-view="settings">Settings</button>
    </nav>

    <button class="reset-link" id="resetData">Reset demo data</button>
  </aside>
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- MAIN -->
  <main class="main">

    <div class="topbar">
      <div class="topbar-left">
        <button class="icon-button menu-toggle" id="menuToggle" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div>
          <h1 class="page-title" id="pageTitle" tabindex="-1">Today</h1>
          <div class="page-subtitle" id="todayLabel"></div>
        </div>
      </div>

      <div class="top-actions">
        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Search tasks, brands, people"
          aria-label="Search"
          hidden
        />
        <button class="icon-button" id="searchToggle" aria-label="Search">⌕</button>
        <button class="icon-button notify-button" id="notifyButton" aria-label="Notifications">
          ♧<span class="badge" id="notifyBadge" hidden></span>
        </button>
        <div class="avatar" id="avatar"></div>
      </div>
    </div>

    <div id="view"></div>

  </main>

  <!-- FORM MODAL (content is built by js/ui.js) -->
  <div class="modal-overlay" id="formModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="modalForm" novalidate></form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- SIGN-IN (team mode only; built by js/cloud.js) -->
  <div class="auth-screen" id="authScreen" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/creative-export.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
